<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Memoria Material · Storyboard del tráiler</title>
  <meta name="description" content="Storyboard interactivo del tráiler de Memoria Material: el minuto del tráiler, escena por escena.">
  <meta name="theme-color" content="#352A72">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' fill='%23352A72'/%3E%3Cpath d='M6 8h20v8H6z' fill='%23F2EDD4'/%3E%3Cpath d='M16 16a8 8 0 0 1 0 16z' fill='%23ED4380'/%3E%3Cpath d='M6 18h4v10H6z' fill='%233CC5F2'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="css/tramas.css">
  <link rel="stylesheet" href="css/styles.css">
  <script>document.documentElement.classList.add('js');</script>
</head>
<body>
  <a class="skip" href="#escena1">Saltar a la primera escena</a>

  <header class="cover" id="portada" aria-label="Portada">
    <div class="grid-bg" aria-hidden="true"><span></span></div>
    <div class="cover__shapes" aria-hidden="true">
      <i class="shape shape--semi c-amarillo"></i>
      <i class="shape shape--quarter c-celeste"></i>
      <i class="shape shape--pill c-fucsia"></i>
      <i class="trama trama--ondas c-fucsia"></i>
    </div>
    <div class="cover__inner">
      <p class="cover__kicker mono"><span>Tesis 2026</span><span>Storyboard interactivo</span></p>
      <h1 class="cover__logo" data-logo="cover"><span class="sr-only">Memoria Material</span></h1>
      <div class="cover__meta">
        <p class="cover__bajada" data-bind="bajada"></p>
        <p class="cover__dur mono"><span>Duración</span> <strong data-bind="duracion"></strong></p>
      </div>
    </div>
    <div class="cover__hint mono" aria-hidden="true"><span>Scroll</span><i></i></div>
  </header>

  <main id="escenas"></main>

  <footer class="cierre" id="cierre" aria-labelledby="cierre-pregunta">
    <div class="grid-bg" aria-hidden="true"><span></span></div>
    <h2 class="cierre__pregunta" id="cierre-pregunta"></h2>
    <div class="cierre__logo" data-logo="cierre"></div>
    <div class="ficha">
      <dl class="ficha__datos"></dl>
      <div class="ficha__equipo">
        <h3 class="mono">Equipo</h3>
        <ul></ul>
      </div>
      <div class="ficha__docentes">
        <h3 class="mono">Docentes</h3>
        <ul></ul>
      </div>
    </div>
    <p class="cierre__pie mono">Storyboard interactivo del tráiler · Memoria Material</p>
  </footer>

  <nav class="timeline" aria-label="Línea de tiempo del tráiler">
    <span class="timeline__now mono" aria-live="off">00:00</span>
    <ol class="timeline__track"></ol>
    <span class="timeline__end mono">01:00</span>
  </nav>

  <script src="contenido.js"></script>
  <script src="js/logo.js"></script>
  <script src="assets/vendor/gsap.min.js"></script>
  <script src="assets/vendor/ScrollTrigger.min.js"></script>
  <script src="assets/vendor/ScrollToPlugin.min.js"></script>
  <script src="js/main.js"></script>
</body>
</html>
